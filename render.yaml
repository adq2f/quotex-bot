services:
  - type: web
    name: quotex-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACCOUNT_TYPE
        value: DEMO
      - key: EXECUTION_MODE
        value: signal_only
      - key: DATA_SOURCE
        value: biquote
      - key: MTG_ALERT_SECONDS
        value: "10"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: WEB_ADMIN_USERNAME
        sync: false
      - key: WEB_ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
