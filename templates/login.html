{% extends "base.html" %}
{% block title %}Login — Quotex Signal Bot{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-secondary">
            <div class="card-body p-4">
                <h3 class="card-title mb-1 text-center">📊 Quotex Signal Bot</h3>
                <p class="text-secondary text-center small mb-4">Sign in to control your bot</p>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Sign In</button>
                </form>
                <p class="text-secondary small text-center mt-3 mb-0">
                    First boot? Check server logs for the generated admin password
                    (or set <code>WEB_ADMIN_PASSWORD</code> in env before starting).
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
